apiVersion: v1
kind: Service
metadata:
  name: hermes-webui
  namespace: hermes
  labels:
    app: hermes-webui
spec:
  type: ClusterIP
  selector:
    app: hermes-webui
  ports:
  # The OIDC front door (oauth2-proxy sidecar). The WebUI itself is loopback-only
  # inside the pod — nothing outside it can skip the login.
  - port: 80
    targetPort: auth
    name: web
    protocol: TCP
