---
# ── Hermes mesh gateway ────────────────────────────────────────────────────────
# The cluster's netbird peer. Its only job: give the hub a private address on the
# netbird mesh and forward that traffic to the in-cluster `hermes-hub` Service.
#
# Why a separate pod instead of a sidecar on the agent: an in-pod netbird installs
# the account's subnet route (192.168.88.0/24 → wt0, table 7120) plus the kernel
# failsafe rules (`suppress_prefixlength 0`), which hijacked the agent pod's LAN
# access, and its peer sessions are not usable for egress from that netns. A gateway
# that only needs *inbound* connectivity (mesh peer connects to us) is unaffected:
# from there it talks to a ClusterIP, which never leaves the pod network.
#
# Identity: the `hermes-netbird-state` PVC holds the peer state, so this pod keeps the
# peer name (`hermes-hub`) and the netbird IP that the NBGroup/NBPolicy objects in
# netbird-operator-ton/resources/hermes-netbird.yaml were built around.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-mesh-proxy
  namespace: hermes
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 256;
    }

    http {
        access_log /dev/stdout;
        default_type application/json;
        client_max_body_size 32m;

        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        map $http_x_forwarded_proto $client_proto {
            default $http_x_forwarded_proto;
            ""      $scheme;
        }

        # Keep the caller's Host so the agents' Agent Cards keep pointing at the
        # address the caller actually used.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $client_proto;

        # The hub router, inside the cluster: ClusterIP traffic never needs a default
        # route, which is exactly why this gateway can live on the mesh safely.
        upstream hub {
            server hermes-hub.hermes.svc.cluster.local:8080;
        }

        server {
            listen 8080;

            location = /healthz {
                default_type text/plain;
                return 200 "ok\n";
            }

            location / {
                proxy_pass http://hub;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-mesh-gateway
  namespace: hermes
  labels:
    app: hermes-mesh-gateway
spec:
  replicas: 1
  # The netbird peer identity is a single-writer PVC: never run two instances.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hermes-mesh-gateway
  template:
    metadata:
      labels:
        app: hermes-mesh-gateway
    spec:
      initContainers:
      # Native sidecar: joins the pod's network namespace to the netbird mesh.
      # --disable-dns is mandatory — with DNS management on, netbird rewrites
      # resolv.conf inside the pod and the ClusterIP above stops resolving.
      - name: netbird
        image: netbirdio/netbird:0.76.2
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          netbird service run &
          pid=$!
          for i in $(seq 1 30); do netbird status --check live 2>/dev/null && break; sleep 1; done
          netbird up --disable-dns --hostname hermes-hub --extra-dns-labels hermes || exit 1
          wait $pid
        env:
        - name: NB_SETUP_KEY
          valueFrom:
            secretKeyRef:
              name: setup-key-hermes
              key: setup-key
        - name: NB_MANAGEMENT_URL
          value: http://netbird-management.netbird.svc.cluster.local:80
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: netbird-state
          mountPath: /var/lib/netbird
      containers:
      - name: mesh-proxy
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
          name: mesh
        readinessProbe:
          httpGet:
            path: /healthz
            port: mesh
          initialDelaySeconds: 3
          periodSeconds: 15
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: proxy-cache
          mountPath: /var/cache/nginx
        - name: proxy-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: proxy-config
        configMap:
          name: hermes-mesh-proxy
      - name: proxy-cache
        emptyDir: {}
      - name: proxy-tmp
        emptyDir: {}
      - name: netbird-state
        persistentVolumeClaim:
          claimName: hermes-netbird-state
