apiVersion: v1
kind: Service
metadata:
  name: hermes-hub
  namespace: hermes
  labels:
    app: hermes
spec:
  type: ClusterIP
  selector:
    app: hermes
  ports:
  - port: 8080
    targetPort: hub
    name: hub
    protocol: TCP
  # The desktop app's backend (hermes serve). ClusterIP only: the mesh gateway is
  # the sole path in from outside the cluster, and that path is netbird-only.
  - port: 9119
    targetPort: serve
    name: serve
    protocol: TCP
