apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  # The pod holds two RWO PVCs (agent home + netbird peer identity) and two netbird
  # peers sharing one identity would race over the WireGuard state, so rollouts must
  # never overlap: maxSurge 0 / maxUnavailable 1 = the old pod goes away before the new
  # one starts (essentially Recreate, but expressed as RollingUpdate — switching the
  # strategy type would fight the rollingUpdate the API server had already defaulted
  # on this object and server-side apply refuses to drop it).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: init-config
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Copy config (sempre, pode mudar via ConfigMap)
          cp /config-source/config.yaml /opt/data/config.yaml
          # Copy identity/persona (ton-cluster) - determinística via ConfigMap
          cp /config-source/SOUL.md /opt/data/SOUL.md
          # Garante ownership do home pro user hermes (uid 10000) — NFS cria
          # subdirs como root e a imagem pode soltar SOUL.md read-only (444),
          # o que quebra o gateway v2026.8.19 tentando escrever nele
          # ([Errno 13] Permission denied -> provider auth / kanban / approval)
          chown -R 10000:10000 /opt/data
          # SOUL.md precisa ser gravável pelo owner p/ a persona ser reconciliada
          if [ -f /opt/data/SOUL.md ]; then chmod u+w /opt/data/SOUL.md; fi
          # Download kubectl apenas se não existir
          if [ ! -x /opt/data/kubectl ]; then
            wget -qO /opt/data/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
            chmod +x /opt/data/kubectl
          fi
          # Regenera kubeconfig (token do SA pode rotacionar)
          read -r KUBE_TOKEN < /var/run/secrets/kubernetes.io/serviceaccount/token
          KUBE_CA=$(base64 -w0 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
          cat > /opt/data/kubeconfig.yaml <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: ${KUBE_CA}
              server: https://kubernetes.default.svc
            name: in-cluster
          contexts:
          - context:
              cluster: in-cluster
              user: hermes
            name: hermes
          current-context: hermes
          users:
          - name: hermes
            user:
              token: ${KUBE_TOKEN}
          EOF
        volumeMounts:
        - name: config-source
          mountPath: /config-source
        - name: data
          mountPath: /opt/data
      # ── NetBird mesh presence (native sidecar) ──────────────────────────────
      # Attaches the pod network namespace to the netbird mesh: the agent can dial any
      # mesh peer (ton-desktop, celular, ...) at its netbird IP, and mesh peers can reach
      # the a2a-router container below. Peer identity lives on the PVC (stable IP across
      # restarts) and the setup key comes from the netbird-operator SetupKey CR
      # (lag0-fleet-manifests/netbird-operator-ton/resources/hermes-netbird.yaml).
      # --disable-dns keeps netbird out of the pod's resolv.conf — without it netbird
      # hijacks resolv.conf and black-holes cluster DNS (broke the agent in Aug 2026).
      - name: netbird
        image: netbirdio/netbird:0.76.2
        imagePullPolicy: IfNotPresent
        restartPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          netbird service run &
          pid=$!
          for i in $(seq 1 30); do netbird status --check live 2>/dev/null && break; sleep 1; done
          netbird up --disable-dns --hostname hermes-hub --extra-dns-labels hermes || exit 1
          wait $pid
        env:
        - name: NB_SETUP_KEY
          valueFrom:
            secretKeyRef:
              name: setup-key-hermes
              key: setup-key
        - name: NB_MANAGEMENT_URL
          value: http://netbird-management.netbird.svc.cluster.local:80
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: netbird-state
          mountPath: /var/lib/netbird
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:v2026.8.19
        args:
        - hermes
        - gateway
        - run
        env:
        # ── API Server ──
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_PORT
          value: "8642"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: api-server-key
        # ── Provider (DeepSeek) ──
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: deepseek-api-key
        # ── A2A (Agent-to-Agent) ──
        # The A2A server binds 127.0.0.1:9900 (A2A_HOST default); the in-pod
        # a2a-router publishes it as /a2a/cluster. A2A_PUBLIC_URL is deliberately NOT
        # set: the Agent Card then advertises the host/scheme the caller actually used
        # (LAN/Istio name vs mesh name), so the same agent works on both planes.
        - name: A2A_PORT
          value: "9900"
        - name: A2A_AGENT_NAME
          value: "ton-cluster"
        - name: A2A_PEER_TOKENS
          valueFrom:
            secretKeyRef:
              name: hermes-a2a
              key: A2A_PEER_TOKENS
        # Own caller-token: referenced as ${A2A_TOKEN_TON_CLUSTER} in a2a_agents.
        - name: A2A_TOKEN_TON_CLUSTER
          valueFrom:
            secretKeyRef:
              name: hermes-a2a
              key: A2A_TOKEN_TON_CLUSTER
        # ── K8s access ──
        - name: KUBECONFIG
          value: /opt/data/kubeconfig.yaml
        # ── Matrix (ton-cluster bot) — connect to Synapse in-cluster (no external DNS needed) ──
        - name: MATRIX_HOMESERVER
          value: "http://synapse.matrix.svc.cluster.local:8008"
        - name: MATRIX_USER_ID
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_USER
        - name: MATRIX_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_TOKEN
        - name: MATRIX_ALLOWED_ROOMS
          value: "!mLvVwEDcuDoBTNFGqt:matrix.lag0.com.br,!nitWYLPcWEseswyCHy:matrix.lag0.com.br"
        - name: MATRIX_ALLOWED_USERS
          value: "@antonio:matrix.lag0.com.br,@ton-desktop:matrix.lag0.com.br,@ton-cluster:matrix.lag0.com.br"
        - name: MATRIX_REQUIRE_MENTION
          value: "false"
        - name: PATH
          value: /opt/data:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        ports:
        - containerPort: 8642
          name: api
        - containerPort: 9900
          name: a2a
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 1Gi
      # ── A2A router: the hub's front door ───────────────────────────────────
      # Path-routed reverse proxy (/a2a/<agent>/... -> that agent's A2A endpoint).
      # Local agents resolve to 127.0.0.1 (same pod netns); remote agents resolve to a
      # netbird peer through the sidecar's interface (same pod netns). Holds NO
      # credentials: every agent authenticates its own callers with its own
      # per-peer bearer tokens, so nothing secret lives in this manifest.
      - name: a2a-router
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
          name: hub
        readinessProbe:
          httpGet:
            path: /healthz
            port: hub
          initialDelaySeconds: 3
          periodSeconds: 15
        volumeMounts:
        - name: router-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: router-cache
          mountPath: /var/cache/nginx
        - name: router-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config-source
        configMap:
          name: hermes-config
      - name: router-config
        configMap:
          name: hermes-router
      - name: router-cache
        emptyDir: {}
      - name: router-tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: netbird-state
        persistentVolumeClaim:
          claimName: hermes-netbird-state
