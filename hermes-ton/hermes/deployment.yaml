apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: init-config
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Copy config (sempre, pode mudar via ConfigMap)
          cp /config-source/config.yaml /opt/data/config.yaml
          # Copy identity/persona (ton-cluster) - determinística via ConfigMap
          cp /config-source/SOUL.md /opt/data/SOUL.md
          # Garante ownership do home pro user hermes (uid 10000) — NFS cria
          # subdirs como root e a imagem pode soltar SOUL.md read-only (444),
          # o que quebra o gateway v2026.8.19 tentando escrever nele
          # ([Errno 13] Permission denied -> provider auth / kanban / approval)
          chown -R 10000:10000 /opt/data
          # SOUL.md precisa ser gravável pelo owner p/ a persona ser reconcilada
          if [ -f /opt/data/SOUL.md ]; then chmod u+w /opt/data/SOUL.md; fi
          # Download kubectl apenas se não existir
          if [ ! -x /opt/data/kubectl ]; then
            wget -qO /opt/data/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
            chmod +x /opt/data/kubectl
          fi
          # Regenera kubeconfig (token do SA pode rotacionar)
          read -r KUBE_TOKEN < /var/run/secrets/kubernetes.io/serviceaccount/token
          KUBE_CA=$(base64 -w0 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
          cat > /opt/data/kubeconfig.yaml <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: ${KUBE_CA}
              server: https://kubernetes.default.svc
            name: in-cluster
          contexts:
          - context:
              cluster: in-cluster
              user: hermes
            name: hermes
          current-context: hermes
          users:
          - name: hermes
            user:
              token: ${KUBE_TOKEN}
          EOF
        volumeMounts:
        - name: config-source
          mountPath: /config-source
        - name: data
          mountPath: /opt/data
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:v2026.8.19
        args:
        - hermes
        - gateway
        - run
        env:
        # ── API Server ──
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_PORT
          value: "8642"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: api-server-key
        # ── Provider (DeepSeek) ──
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: deepseek-api-key
        # ── K8s access ──
        - name: KUBECONFIG
          value: /opt/data/kubeconfig.yaml
        # ── Matrix (ton-cluster bot) — connect to Synapse in-cluster (no external DNS needed) ──
        - name: MATRIX_HOMESERVER
          value: "http://synapse.matrix.svc.cluster.local:8008"
        - name: MATRIX_USER_ID
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_USER
        - name: MATRIX_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_TOKEN
        - name: MATRIX_ALLOWED_ROOMS
          value: "!LXjbrqWQIBPwsZRlmF:matrix.lag0.com.br"
        - name: MATRIX_REQUIRE_MENTION
          value: "false"
        - name: PATH
          value: /opt/data:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        ports:
        - containerPort: 8642
          name: api
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 1Gi
      - name: netbird
        image: netbirdio/netbird:0.76.2
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          netbird service run &
          pid=$!
          for i in $(seq 1 30); do netbird status --check live 2>/dev/null && break; sleep 1; done
          # --disable-dns: keep NetBird's WireGuard/route but DO NOT hijack the
          # pod's /etc/resolv.conf (otherwise cluster.local / *.lag0.com.br and
          # external DNS all break, isolating the agent from everything).
          netbird up --disable-dns || exit 1
          wait $pid
        env:
        - name: NB_SETUP_KEY
          valueFrom:
            secretKeyRef:
              name: setup-key-hermes
              key: setup-key
        - name: NB_MANAGEMENT_URL
          value: http://netbird-management.netbird.svc.cluster.local:80
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        restartPolicy: Always
        volumeMounts:
        - name: netbird-state
          mountPath: /var/lib/netbird
      volumes:
      - name: config-source
        configMap:
          name: hermes-config
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - name: netbird-state
        persistentVolumeClaim:
          claimName: hermes-netbird-state
