apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  # The pod holds two RWO PVCs (agent home + netbird peer identity) and two netbird
  # peers sharing one identity would race over the WireGuard state, so rollouts must
  # never overlap: maxSurge 0 / maxUnavailable 1 = the old pod goes away before the new
  # one starts (essentially Recreate, but expressed as RollingUpdate — switching the
  # strategy type would fight the rollingUpdate the API server had already defaulted
  # on this object and server-side apply refuses to drop it).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: init-config
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          # Copy config (sempre, pode mudar via ConfigMap)
          cp /config-source/config.yaml /opt/data/config.yaml
          # Copy identity/persona (ton-cluster) - determinística via ConfigMap
          cp /config-source/SOUL.md /opt/data/SOUL.md
          # Garante ownership do home pro user hermes (uid 10000) — NFS cria
          # subdirs como root e a imagem pode soltar SOUL.md read-only (444),
          # o que quebra o gateway v2026.8.19 tentando escrever nele
          # ([Errno 13] Permission denied -> provider auth / kanban / approval)
          chown -R 10000:10000 /opt/data
          # SOUL.md precisa ser gravável pelo owner p/ a persona ser reconciliada
          if [ -f /opt/data/SOUL.md ]; then chmod u+w /opt/data/SOUL.md; fi
          # Download kubectl apenas se não existir
          if [ ! -x /opt/data/kubectl ]; then
            wget -qO /opt/data/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
            chmod +x /opt/data/kubectl
          fi
          # Regenera kubeconfig (token do SA pode rotacionar)
          read -r KUBE_TOKEN < /var/run/secrets/kubernetes.io/serviceaccount/token
          KUBE_CA=$(base64 -w0 < /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
          cat > /opt/data/kubeconfig.yaml <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: ${KUBE_CA}
              server: https://kubernetes.default.svc
            name: in-cluster
          contexts:
          - context:
              cluster: in-cluster
              user: hermes
            name: hermes
          current-context: hermes
          users:
          - name: hermes
            user:
              token: ${KUBE_TOKEN}
          EOF
        volumeMounts:
        - name: config-source
          mountPath: /config-source
        - name: data
          mountPath: /opt/data
      # ── NetBird: NOT in this pod ───────────────────────────────────────────
      # The agent pod must keep a pristine network namespace: a netbird sidecar here
      # installs the account's subnet route (192.168.88.0/24 dev wt0 in table 7120)
      # and the kernel failsafe rules (suppress_prefixlength 0), which pulled the LAN
      # into the tunnel and made the pod unable to reach the desktop at all, and its
      # peer sessions never became usable for egress. The mesh presence lives in the
      # dedicated `hermes-mesh-gateway` peer (hermes/mesh-gateway.yaml), which proxies
      # mesh traffic to the hermes-hub Service and only needs inbound connectivity.
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:v2026.8.19
        args:
        - hermes
        - gateway
        - run
        env:
        # ── API Server ──
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_PORT
          value: "8642"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: api-server-key
        # ── Provider (DeepSeek) ──
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: deepseek-api-key
        # ── A2A (Agent-to-Agent) ──
        # The A2A server binds 127.0.0.1:9900 (A2A_HOST default); the in-pod
        # a2a-router publishes it as /a2a/cluster, on Istio and on the netbird mesh.
        # A2A_PUBLIC_URL pins the Agent Card to the hub path: without it the card
        # would advertise just the host the caller used ("https://hermes.lag0.com.br/")
        # and a peer would POST to the Open WebUI root instead of this agent.
        - name: A2A_PORT
          value: "9900"
        - name: A2A_AGENT_NAME
          value: "ton-cluster"
        - name: A2A_PUBLIC_URL
          value: "https://hermes.lag0.com.br/a2a/cluster"
        - name: A2A_PEER_TOKENS
          valueFrom:
            secretKeyRef:
              name: hermes-a2a
              key: A2A_PEER_TOKENS
        # Own caller-token: referenced as ${A2A_TOKEN_TON_CLUSTER} in a2a_agents.
        - name: A2A_TOKEN_TON_CLUSTER
          valueFrom:
            secretKeyRef:
              name: hermes-a2a
              key: A2A_TOKEN_TON_CLUSTER
        # ── K8s access ──
        - name: KUBECONFIG
          value: /opt/data/kubeconfig.yaml
        # ── Matrix (ton-cluster bot) — connect to Synapse in-cluster (no external DNS needed) ──
        - name: MATRIX_HOMESERVER
          value: "http://synapse.matrix.svc.cluster.local:8008"
        - name: MATRIX_USER_ID
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_USER
        - name: MATRIX_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: matrix-bot-secrets
              key: TON_CLUSTER_TOKEN
        - name: MATRIX_ALLOWED_ROOMS
          value: "!mLvVwEDcuDoBTNFGqt:matrix.lag0.com.br,!nitWYLPcWEseswyCHy:matrix.lag0.com.br"
        - name: MATRIX_ALLOWED_USERS
          value: "@antonio:matrix.lag0.com.br,@ton-desktop:matrix.lag0.com.br,@ton-cluster:matrix.lag0.com.br"
        - name: MATRIX_REQUIRE_MENTION
          value: "false"
        - name: PATH
          value: /opt/data:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        ports:
        - containerPort: 8642
          name: api
        - containerPort: 9900
          name: a2a
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 1Gi
      # ── Remote gateway: the desktop app's backend ───────────────────────────
      # `hermes serve` is the JSON-RPC/WebSocket server the desktop app dials.
      # It mounts the SAME home as the agent (same PVC), so a session opened from
      # the app is this agent — not a second, empty one. Callers authenticate with
      # Pocket ID through the generic self-hosted OIDC provider (dashboard_auth
      # plugin `self_hosted`): public client + PKCE, so no shared secret exists in
      # this manifest, in a Secret, or in the desktop app. That provider is also why
      # the bind can be 0.0.0.0 — a non-loopback bind is only allowed with an auth
      # provider configured (June 2026 hardening), and OIDC counts.
      #
      # Reachability is the mesh: the desktop dials http://100.82.233.235:9119,
      # which only exists inside netbird (MeshGateway proxies it to this Service).
      - name: serve
        image: nousresearch/hermes-agent:v2026.8.19
        args:
        - hermes
        - serve
        - --host
        - 0.0.0.0
        - --port
        - "9119"
        env:
        - name: HERMES_DASHBOARD_OIDC_ISSUER
          value: https://id.lag0.com.br
        - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
          value: 5a9b19e1-3602-42c5-afe1-2333e2f0c7fe
        - name: HERMES_DASHBOARD_OIDC_SCOPES
          value: "openid profile email"
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: deepseek-api-key
        - name: KUBECONFIG
          value: /opt/data/kubeconfig.yaml
        - name: PATH
          value: /opt/data:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        ports:
        - containerPort: 9119
          name: serve
        readinessProbe:
          tcpSocket:
            port: serve
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: data
          mountPath: /opt/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
      # ── A2A router: the hub's front door ───────────────────────────────────
      # Path-routed reverse proxy (/a2a/<agent>/... -> that agent's A2A endpoint).
      # Local agents resolve to 127.0.0.1 (same pod netns); remote agents resolve to a
      # netbird peer through the sidecar's interface (same pod netns). Holds NO
      # credentials: every agent authenticates its own callers with its own
      # per-peer bearer tokens, so nothing secret lives in this manifest.
      - name: a2a-router
        image: nginx:1.27-alpine
        ports:
        - containerPort: 8080
          name: hub
        readinessProbe:
          httpGet:
            path: /healthz
            port: hub
          initialDelaySeconds: 3
          periodSeconds: 15
        volumeMounts:
        - name: router-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: router-cache
          mountPath: /var/cache/nginx
        - name: router-tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config-source
        configMap:
          name: hermes-config
      - name: router-config
        configMap:
          name: hermes-router
      - name: router-cache
        emptyDir: {}
      - name: router-tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
