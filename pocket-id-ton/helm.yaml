apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  interval: 24h
  url: https://anza-labs.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  releaseName: pocket-id
  targetNamespace: pocket-id
  install:
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  interval: 30m
  chart:
    spec:
      chart: pocket-id
      sourceRef:
        kind: HelmRepository
        name: pocket-id
        namespace: pocket-id
      version: 2.2.2
      interval: 12h
  values:
    host: "id.lag0.com.br"
    config:
      ui:
        useDefaults: true
    secret:
      create: false
      name: pocket-id-env
    pocketID:
      image:
        tag: v2.19.2
    persistence:
      data:
        enabled: true
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      timeoutSeconds: 5
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      timeoutSeconds: 5
      failureThreshold: 30
      periodSeconds: 10
    ingress:
      enabled: false
