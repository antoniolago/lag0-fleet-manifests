apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: descheduler
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/descheduler/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: descheduler
spec:
  releaseName: descheduler
  targetNamespace: descheduler
  install:
    createNamespace: false
  interval: 30m
  chart:
    spec:
      chart: descheduler
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: descheduler
      interval: 12h
  values:
    kind: CronJob
    schedule: "*/10 * * * *"
    suspend: false
    deschedulingInterval: 5m
    cmdOptions:
      v: 3
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictSystemCriticalPods: false
                nodeFit: true
                podProtections:
                  extraEnabled:
                    - PodsWithPVC
                    - PodsWithoutPDB
            - name: RemoveDuplicates
            - name: RemovePodsViolatingTopologySpreadConstraint
            - name: LowNodeUtilization
              args:
                # thresholds = no subutilizado; targetThresholds = no sobrecarregado.
                # So despeja de no acima do target para no abaixo do threshold.
                thresholds:
                  cpu: 30
                  memory: 40
                  pods: 30
                targetThresholds:
                  cpu: 70
                  memory: 80
                  pods: 85
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
