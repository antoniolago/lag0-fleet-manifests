---
apiVersion: v1
kind: ConfigMap
metadata:
  name: galzolina-bootstrap
  namespace: galzolina
data:
  # Must-use plugin: configuração declarativa do site (não pode ser desativado pelo wp-admin).
  # Alterações aqui exigem restart do pod (mount via subPath não recarrega sozinho).
  galzolina.php: |
    <?php
    /**
     * Plugin Name: Galzolina — Bootstrap
     * Description: Configuração declarativa do blog: HTTPS atrás do proxy, título, fuso, permalinks e limpeza do conteúdo de exemplo.
     * Version: 1
     *
     * Instalado como must-use plugin (wp-content/mu-plugins/) via ConfigMap. Carrega antes dos
     * plugins comuns e não pode ser desativado pela UI — isto é configuração, não plugin opcional.
     */

    defined( 'ABSPATH' ) || exit;

    /**
     * 1) TLS termina no Cloudflare Tunnel + Istio Gateway: o container só recebe HTTP.
     * Sem isto o WordPress se considera em HTTP e entra em loop de redirect canônico para https.
     */
    if ( empty( $_SERVER['HTTPS'] ) || 'off' === $_SERVER['HTTPS'] ) {
    	$_SERVER['HTTPS'] = 'on';
    }

    /**
     * 2) Bootstrap idempotente — roda uma única vez (guardado na option galzolina_bootstrap).
     */
    add_action(
    	'init',
    	function () {
    		if ( (int) get_option( 'galzolina_bootstrap' ) >= 1 ) {
    			return;
    		}
    		if ( ! is_blog_installed() ) {
    			return;
    		}

    		update_option( 'blogname', 'Galzolina' );
    		update_option( 'blogdescription', 'Receitas simples por Alexia Rocha' );
    		update_option( 'timezone_string', 'America/Sao_Paulo' );
    		update_option( 'start_of_week', 0 );
    		update_option( 'date_format', 'd/m/Y' );
    		update_option( 'permalink_structure', '/%postname%/' );
    		update_option( 'blog_public', 1 );
    		update_option( 'default_ping_status', 'closed' );
    		update_option( 'default_comment_status', 'closed' );
    		update_option( 'comment_registration', 1 );
    		update_option( 'uploads_use_yearmonth_folders', 1 );

    		// Limpa o conteúdo de exemplo do WordPress (só apaga se o título bater).
    		$sample_posts = array(
    			1 => 'Hello world!',
    			2 => 'Sample Page',
    			3 => 'Privacy Policy',
    		);
    		foreach ( $sample_posts as $post_id => $expected_title ) {
    			$post = get_post( $post_id );
    			if ( $post && $expected_title === $post->post_title ) {
    				wp_delete_post( $post_id, true );
    			}
    		}
    		if ( get_comment( 1 ) ) {
    			wp_delete_comment( 1, true );
    		}

    		update_option( 'galzolina_bootstrap', 1 );
    		flush_rewrite_rules();
    	},
    	20
    );

    /**
     * 3) Equivalente a DISALLOW_FILE_EDIT: sem editor de código no wp-admin.
     */
    add_filter(
    	'user_has_cap',
    	function ( $allcaps ) {
    		unset( $allcaps['edit_plugins'], $allcaps['edit_themes'], $allcaps['edit_files'] );
    		return $allcaps;
    	}
    );

    /**
     * 4) Editor clássico (TinyMCE): desliga o Gutenberg em posts/páginas e o editor de blocos
     * de widgets. Estes filtros são a via oficial do core (WP 5.0+) — não há plugin
     * "Classic Editor" instalado, e assim a escolha não pode ser revertida pelo wp-admin.
     */
    add_filter( 'use_block_editor_for_post', '__return_false', 20 );
    add_filter( 'use_block_editor_for_post_type', '__return_false', 20 );
    add_filter( 'use_widgets_block_editor', '__return_false', 20 );
