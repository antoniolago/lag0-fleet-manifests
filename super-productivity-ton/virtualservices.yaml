apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: super-productivity-web
  namespace: super-productivity
spec:
  hosts:
    - productivity.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    # WebDAV por usuário: passa pelo dav-gateway, que autentica no oauth2-proxy
    # e isola o diretório de cada pessoa.
    - match:
        - uri:
            prefix: /dav
      route:
        - destination:
            host: dav-gateway
            port:
              number: 8080
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: oauth2-proxy
            port:
              number: 4180
