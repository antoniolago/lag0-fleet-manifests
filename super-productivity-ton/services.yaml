apiVersion: v1
kind: Service
metadata:
  name: super-productivity-web
  namespace: super-productivity
  labels:
    app: super-productivity-web
spec:
  type: ClusterIP
  selector:
    app: super-productivity-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: super-productivity
  labels:
    app: oauth2-proxy
spec:
  type: ClusterIP
  selector:
    app: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
