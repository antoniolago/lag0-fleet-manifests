apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: super-productivity
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://id.lag0.com.br
            - --upstream=http://super-productivity-web.super-productivity.svc.cluster.local:8080/
            - --http-address=0.0.0.0:4180
            - --redirect-url=https://productivity.lag0.com.br/oauth2/callback
            - --email-domain=*
            - --scope=openid email profile groups
            - --cookie-secure=true
            - --cookie-expire=24h
            - --cookie-refresh=1h
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
            - --approval-prompt=auto
            - --pass-host-header=true
            - --trusted-proxy-ip=10.252.0.0/16
            - --silence-ping-logging=true
            # O Pocket ID só marca e-mail como verificado depois de um clique de
            # verificação; sem esta flag o login morre com 500 ao ler o claim.
            - --insecure-oidc-allow-unverified-email=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-super-productivity
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-super-productivity
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-super-productivity
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
