apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: fluxer
  namespace: fluxer
spec:
  hosts:
    - fluxer.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - route:
        - destination:
            host: fluxer-web
            port:
              number: 80
      timeout: 0s
      headers:
        request:
          set:
            X-Forwarded-Proto: https
