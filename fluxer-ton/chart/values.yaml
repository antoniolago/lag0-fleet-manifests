domain: ""

scheme: https

port: 443

publicOrigin: ""

adminBasePath: /admin

email: ""

clusterDomain: cluster.local

clusterChecks: true

image:
  registry: ghcr.io/fluxerapp
  tag: v1
  pullPolicy: Always
  tags: {}
  digests: {}
  pullSecrets: []
  revision: ""

initImage:
  repository: busybox
  tag: "1.37"
  digest: ""
  pullPolicy: IfNotPresent

secrets:
  existingSecret: ""
  generate: true
  values:
    FLUXER_POSTGRES_PASSWORD: ""
    FLUXER_SEARCH_API_KEY: ""
    FLUXER_S3_ACCESS_KEY_ID: fluxer
    FLUXER_S3_SECRET_ACCESS_KEY: ""
    FLUXER_SUDO_MODE_SECRET: ""
    FLUXER_CONNECTION_INITIATION_SECRET: ""
    FLUXER_PROFILE_PSEUDONYM_SECRET: ""
    FLUXER_GATEWAY_RPC_AUTH_TOKEN: ""
    FLUXER_VALKEY_PASSWORD: ""
    FLUXER_NATS_AUTH_TOKEN: ""
    FLUXER_ERLANG_COOKIE: ""
    FLUXER_MEDIA_PROXY_SECRET_KEY: ""
    FLUXER_MEDIA_PROXY_UPLOAD_RELAY_SECRET_BASE64: ""
    FLUXER_ADMIN_SECRET_KEY_BASE: ""
    FLUXER_ADMIN_OAUTH_CLIENT_SECRET: ""
    FLUXER_SETUP_TOKEN: ""
    FLUXER_ACTIVITYPUB_SIGNING_KEY_BASE64: ""
    FLUXER_LIVEKIT_API_KEY: fluxer
    FLUXER_LIVEKIT_API_SECRET: ""
    FLUXER_VAPID_PUBLIC_KEY: ""
    FLUXER_VAPID_PRIVATE_KEY: ""
  extra: {}

env: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    digest: ""
    pullPolicy: IfNotPresent
  runAsUser: 70
  external:
    host: ""
    port: 5432
    database: fluxer
    username: fluxer
    ssl: ""
  database: fluxer
  username: fluxer
  parameters:
    max_connections: "150"
    shared_buffers: 512MB
    effective_cache_size: 2GB
    work_mem: 8MB
    maintenance_work_mem: 256MB
    autovacuum_work_mem: 128MB
    random_page_cost: "1.1"
    effective_io_concurrency: "200"
    default_statistics_target: "200"
    jit: "off"
    min_wal_size: 80MB
    max_wal_size: 2GB
    checkpoint_completion_target: "0.9"
    wal_buffers: 16MB
    wal_compression: zstd
    bgwriter_delay: 50ms
    bgwriter_lru_maxpages: "1000"
    autovacuum_vacuum_scale_factor: "0.05"
    autovacuum_analyze_scale_factor: "0.02"
    autovacuum_vacuum_cost_limit: "2000"
    track_io_timing: "on"
    shared_preload_libraries: pg_stat_statements
  shmSize: 1Gi
  persistence:
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 5Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9.1-alpine
    digest: ""
    pullPolicy: IfNotPresent
  external:
    url: ""
  maxmemory: 192mb
  maxmemoryPolicy: noeviction
  appendfsync: everysec
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

