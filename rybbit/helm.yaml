apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: rybbit
  namespace: rybbit
spec:
  interval: 10m
  url: oci://harbor.lag0.com.br/library/rybbit
  ref:
    semver: ">=0.0.0-rc"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rybbit
  namespace: rybbit
spec:
  releaseName: rybbit
  targetNamespace: rybbit
  install:
    createNamespace: true
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: rybbit
  values:
    client:
      image:
        tag: v2.4.0
      env:
        NEXT_PUBLIC_BACKEND_URL: "https://rybbit.lag0.com.br"
        NEXT_PUBLIC_DISABLE_SIGNUP: "true"
    backend:
      image:
        tag: v2.4.0
      env:
        BASE_URL: "https://rybbit.lag0.com.br"
        DISABLE_SIGNUP: "true"

    secrets:
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
    ingress:
      enabled: false
    valkey:
      persistence:
        storageClass: large-storage
