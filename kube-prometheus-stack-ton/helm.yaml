apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: kube-prometheus-stack
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: kube-prometheus-stack

spec:
  suspend: false
  releaseName: prometheus
  targetNamespace: kube-prometheus-stack
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "79.7.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: kube-prometheus-stack
      interval: 12h
  values:
    crds:
      enabled: true
    alertmanager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 8GB
        scrapeInterval: 30s
        evaluationInterval: 30s
        nodeSelector:
          kubernetes.io/hostname: ton-cluster-k8s-worker-2
        resources:
          requests:
            cpu: 200m
            memory: 600Mi
          limits:
            cpu: "1"
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 12Gi
        additionalScrapeConfigs:
          - job_name: netbird-management
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - netbird
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_label_app_kubernetes_io_name
                regex: netbird-management
                action: keep
              - source_labels:
                  - __meta_kubernetes_pod_container_port_name
                regex: metrics
                action: keep
              - source_labels:
                  - __meta_kubernetes_pod_name
                target_label: instance
          - job_name: lag0-exporter
            scrape_interval: 60s
            scrape_timeout: 25s
            static_configs:
              - targets:
                  - 192.168.88.108:9101
                labels:
                  layer: lan
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 30m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 30m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin
      nodeSelector:
        kubernetes.io/hostname: ton-cluster-k8s-worker-2
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi
      persistence:
        enabled: true
        type: sts
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        size: 2Gi
        finalizers:
          - kubernetes.io/pvc-protection
      env:
        GF_PANELS_DISABLE_SANITIZE_HTML: "true"
        GF_SERVER_ROOT_URL: https://grafana.lag0.com.br/
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client_secret
      grafana.ini:
        server:
          domain: grafana.lag0.com.br
          root_url: https://grafana.lag0.com.br/
        auth:
          disable_login_form: false
          oauth_auto_login: false
        auth.generic_oauth:
          enabled: true
          name: Pocket ID
          allow_sign_up: true
          client_id: grafana
          scopes: openid profile email groups
          auth_url: https://id.lag0.com.br/authorize
          token_url: https://id.lag0.com.br/api/oidc/token
          api_url: https://id.lag0.com.br/api/oidc/userinfo
          use_pkce: false
          login_attribute_path: preferred_username
          name_attribute_path: name
          email_attribute_path: email
          groups_attribute_path: groups
          role_attribute_path: "contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'"
          allow_assign_grafana_admin: true
          signout_redirect_url: https://id.lag0.com.br/api/oidc/end-session
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: grafana_folder
        datasources:
          enabled: true
