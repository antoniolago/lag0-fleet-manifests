---
apiVersion: v1
kind: Service
metadata:
  name: istio-gateway
  namespace: istio-system
  labels:
    app: istio-gateway
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.88.190
  # Preserve the client source IP so Istio AuthorizationPolicy IP
  # allowlists (remoteIpBlocks/notRemoteIpBlocks) see the real client.
  # Cluster (default) SNATs the source to a node IP, breaking IP allowlists.
  externalTrafficPolicy: Local
  selector:
    app: istio-gateway
  ports:
    - name: status-port
      port: 15021
      protocol: TCP
      targetPort: 15021
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 80
    - name: https
      port: 443
      protocol: TCP
      targetPort: 443
