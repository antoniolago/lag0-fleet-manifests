apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-dump-s3-cronjob
spec:
  schedule: "0 0 * * *"  # Run daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: DB_HOST
                  value: "immich-db.immich.svc.cluster.local"
                - name: DB_PORT
                  value: "5432"
                - name: DB_USER
                  value: "immich"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-secrets-ton
                      key: password
                - name: DB_NAME
                  value: "immich"
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  export PGPASSWORD=$DB_PASSWORD
                  DUMP_FILE=${DB_NAME}_$(date +%Y%m%d%H%M).sql
                  pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER $DB_NAME > /shared/$DUMP_FILE
                  echo $DUMP_FILE > /shared/backup_file_name.txt
                  echo "Database dump created at $DUMP_FILE"
              volumeMounts:
                - name: shared-storage
                  mountPath: /shared
          containers:
            - name: upload-dump-to-s3
              image: d3fk/s3cmd
              env:
                - name: DB_NAME
                  value: "immich"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: rustfs-credentials
                      key: secret-key
                - name: S3_BUCKET
                  value: "backups"
                - name: S3_PATH
                  value: "immich/daily"
                - name: S3_ENDPOINT
                  value: "s3.lag0.com.br"
                - name: S3_REGION
                  value: "ton-cluster"
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  cat > /root/.s3cfg << CFGEOF
                  [default]
                  access_key = ${AWS_ACCESS_KEY_ID}
                  secret_key = ${AWS_SECRET_ACCESS_KEY}
                  host_base = ${S3_ENDPOINT}
                  host_bucket = ${S3_ENDPOINT}
                  use_https = True
                  signature_v2 = False
                  bucket_location = ${S3_REGION}
                  CFGEOF
                  BACKUP_FILE=$(cat /shared/backup_file_name.txt)
                  s3cmd put /shared/$BACKUP_FILE s3://$S3_BUCKET/$S3_PATH/$BACKUP_FILE
                  echo "Backup and upload completed successfully!"
              volumeMounts:
                - name: shared-storage
                  mountPath: /shared
          restartPolicy: OnFailure
          volumes:
            - name: shared-storage
              emptyDir: {}
