apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stalwart
  namespace: mail
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: mail
spec:
  serviceName: stalwart-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
        app.kubernetes.io/part-of: mail
    spec:
      # Sem volume persistente pago (oci-bv custa por GB). O no e unico e tem
      # disco local; a durabilidade vem do backup no rustfs (cronjob backup.yaml).
      # RocksDB exige disco local de qualquer forma -- NFS corromperia.
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      securityContext:
        fsGroup: 0
      containers:
        - name: netbird
          image: netbirdio/netbird:0.83.1
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-setup
                  key: key
            - name: NB_MANAGEMENT_URL
              value: https://nb.lag0.com.br
            - name: NB_LOG_LEVEL
              value: info
            - name: NB_DISABLE_DNS
              value: "true"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: netbird-state
              mountPath: /var/lib/netbird
            - name: tun
              mountPath: /dev/net/tun
        - name: stalwart
          image: stalwartlabs/stalwart:v1.1.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/stalwart/config.json"
          ports:
            - { name: smtp, containerPort: 25 }
            - { name: smtps, containerPort: 465 }
            - { name: submission, containerPort: 587 }
            - { name: imaps, containerPort: 993 }
            - { name: http, containerPort: 8080 }
          env:
            - name: STALWART_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: data
          hostPath:
            path: /var/lib/stalwart
            type: DirectoryOrCreate
        - name: netbird-state
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
