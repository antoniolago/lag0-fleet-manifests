apiVersion: v1
kind: Service
metadata:
  name: stalwart-headless
  namespace: mail
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
    - { name: smtps, port: 465, targetPort: smtps }
    - { name: submission, port: 587, targetPort: submission }
    - { name: imaps, port: 993, targetPort: imaps }
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: mail
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    - { name: smtp, port: 25, targetPort: smtp }
