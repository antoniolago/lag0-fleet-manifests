apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: obeone
  namespace: technitium-dns
spec:
  interval: 24h
  url: https://charts.obeone.cloud
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: technitium-dns
  namespace: technitium-dns
spec:
  releaseName: technitium-dns-release
  targetNamespace: technitium-dns
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: technitium-dnsserver
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: obeone
        namespace: technitium-dns
      interval: 12h
  values:
    env:
      TZ: "America/Sao_Paulo"

    service:
      main:
        enabled: true
        primary: true
        type: LoadBalancer

    persistence:
      config:
        enabled: true
        type: pvc
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: large-storage
        retain: true

  postRenderers:
    - kustomize:
        patches:
          # NetBird sidecar com identidade persistente (PVC em /var/lib/netbird)
          # — o operador (SidecarProfile) não persiste estado e o IP do peer
          #   muda a cada restart, quebrando o nameserver configurado no NetBird.
          - target:
              kind: Deployment
              name: technitium-dns-release-technitium-dnsserver
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: technitium-dns-release-technitium-dnsserver
              spec:
                template:
                  spec:
                    initContainers:
                      - name: netbird
                        image: netbirdio/netbird:0.76.2
                        imagePullPolicy: IfNotPresent
                        command:
                          - /bin/sh
                          - -c
                          - |
                            netbird service run &
                            pid=$!
                            for i in $(seq 1 30); do netbird status --check live 2>/dev/null && break; sleep 1; done
                            # --disable-dns: o DNS local do netbird sombreia o Technitium
                            # (bind no IP do mesh :53, sobe antes do container principal e
                            #  responde queries sem aplicar a blocklist). Technitium é o resolver.
                            netbird up --disable-dns || exit 1
                            wait $pid
                        env:
                          - name: NB_SETUP_KEY
                            valueFrom:
                              secretKeyRef:
                                name: setup-key-technitium-dns
                                key: setup-key
                          - name: NB_MANAGEMENT_URL
                            value: http://netbird-management.netbird.svc.cluster.local:80
                        securityContext:
                          capabilities:
                            add:
                              - NET_ADMIN
                        restartPolicy: Always
                        volumeMounts:
                          - name: netbird-state
                            mountPath: /var/lib/netbird
                    volumes:
                      - name: netbird-state
                        persistentVolumeClaim:
                          claimName: technitium-netbird-state