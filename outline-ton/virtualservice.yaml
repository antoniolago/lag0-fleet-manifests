---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: outline
  namespace: outline
spec:
  hosts:
    - outline.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: outline
            port:
              number: 3000
      headers:
        request:
          set:
            X-Forwarded-Proto: https
