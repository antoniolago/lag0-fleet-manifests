apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: outline-pg
  namespace: outline
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 10Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: outline
      owner: outline
      secret:
        name: outline-pg-credentials
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
