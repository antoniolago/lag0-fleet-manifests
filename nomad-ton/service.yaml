apiVersion: v1
kind: Service
metadata:
  name: nomad
  namespace: nomad
  labels:
    app: nomad
spec:
  type: ClusterIP
  selector:
    app: nomad
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: rpc
      port: 4647
      targetPort: rpc
    - name: serf
      port: 4648
      targetPort: serf
