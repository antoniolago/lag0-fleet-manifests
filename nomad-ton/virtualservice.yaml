apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: nomad
  namespace: nomad
spec:
  hosts:
    - nomad.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: nomad
            port:
              number: 80
