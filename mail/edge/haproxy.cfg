global
    log /dev/log local0
    maxconn 500
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 10s
    timeout client  5m
    timeout server  5m
    retries 3

# Borda de transporte do lag0: so conexao, nenhum estado de e-mail.
# Encaminha com PROXY protocol v2 para o pod do Stalwart no overlay NetBird.
# O Stalwart so aceita o header vindo de 100.82.78.56 (esta maquina).

frontend smtp_mx
    bind :25
    default_backend stalwart_smtp

frontend smtps
    bind :465
    default_backend stalwart_smtps

frontend submission
    bind :587
    default_backend stalwart_submission

frontend imaps
    bind :993
    default_backend stalwart_imaps

frontend https_admin
    bind :443
    default_backend stalwart_https

# SMTP fala primeiro (banner 220), entao o health check enxerga resposta.
backend stalwart_smtp
    server stalwart 100.82.43.230:25 send-proxy-v2

backend stalwart_submission
    server stalwart 100.82.43.230:587 send-proxy-v2

# Listeners implicit-TLS esperam o ClientHello do cliente: health check TCP
# sempre estoura e derruba o backend. Sem check aqui de proposito.
backend stalwart_smtps
    server stalwart 100.82.43.230:465 send-proxy-v2

backend stalwart_imaps
    server stalwart 100.82.43.230:993 send-proxy-v2

backend stalwart_https
    server stalwart 100.82.43.230:443 send-proxy-v2
