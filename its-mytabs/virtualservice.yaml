---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: its-mytabs
  namespace: its-mytabs
spec:
  hosts:
    - tabs.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: its-mytabs
            port:
              number: 47777
