---
# Uptime Kuma (instancia "snp"). Estado 100% em SQLite sob /app/data; o PVC e a
# unica coisa que precisa persistir. large-storage (NFS) como o resto do cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-snp
  namespace: uptime-kuma-snp
spec:
  replicas: 1
  # SQLite em PVC read-write-once: nunca dois pods.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma-snp
  template:
    metadata:
      labels:
        app: uptime-kuma-snp
    spec:
      containers:
        - name: uptime-kuma
          # Tag fixa: o painel nao suporta downgrade de banco e “:1” e’ flutuante.
          image: docker.io/louislam/uptime-kuma:1.23.17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: UPTIME_KUMA_HOST
              value: "0.0.0.0"
            - name: UPTIME_KUMA_PORT
              value: "3001"
            - name: TZ
              value: America/Sao_Paulo
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma-snp-data
