apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: companion
  namespace: companion
spec:
  hosts:
    - companion.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: companion-service
            port:
              number: 8000
