apiVersion: apps/v1
kind: Deployment
metadata:
  name: companion-proxy
  namespace: companion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: companion-proxy
  template:
    metadata:
      labels:
        app: companion-proxy
    spec:
      containers:
        - name: proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: cfg
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: cfg
          configMap:
            name: companion-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: companion-proxy
  namespace: companion
spec:
  selector:
    app: companion-proxy
  ports:
    - name: http
      port: 80
      targetPort: 80
