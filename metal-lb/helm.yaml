---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  url: https://metallb.github.io/metallb
  interval: 10m

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1m
  chart:
    spec:
      chart: metallb
      version: "0.15.3"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
  values:
    speaker:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      podSecurityContext:
        runAsNonRoot: false
        runAsUser: 0
      # O speaker anuncia o IP L2 (VIP .191 do DNS, .190 do ingress).
      # Sem isso ele e BestEffort e o OOMController do Talos mata ele primeiro.
      priorityClassName: system-node-critical
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi