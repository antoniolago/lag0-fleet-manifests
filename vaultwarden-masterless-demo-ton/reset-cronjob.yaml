# Daily demo reset.
#
# Empties the demo's data so each day starts from a clean vault, then restarts
# the workloads so they build fresh databases.
#
# Why not delete the PVCs (the previous approach):
#   1. The NFS CSI driver maps a PVC to `${namespace}_${pvc_name}` on the server,
#      so deleting and recreating a PVC re-attaches the *same* directory — the old
#      SQLite files survive and the "reset" resets nothing.
#   2. Recreating a PVC needs a Helm upgrade, which a CronJob cannot trigger with
#      `kubectl scale`.
# Removing the files while the workloads keep running and then restarting them
# avoids both problems, and the demo is never left scaled to zero.
#
# Vaultwarden's database and masterless's database must be reset TOGETHER:
# masterless holds the wrapping material for the user vault keys, so resetting
# one without the other leaves every vault item undecryptable.
#
# `SSO_SIGNUPS_ALLOWED=true` (set in helm.yaml) lets the demo account be
# recreated through SSO after a wipe; password signups remain disabled.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-masterless-demo-reset
  namespace: vaultwarden-masterless-demo
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: vaultwarden-masterless-demo-reset
          initContainers:
            - name: wipe-data
              # Files are owned by uid 1000 (masterless) and root (Vaultwarden)
              image: docker.io/library/busybox:1.36
              command:
                - /bin/sh
                - -ec
                - |
                  echo "=== wiping vaultwarden-masterless demo data ==="
                  for dir in /masterless /vaultwarden; do
                    echo "--- ${dir} before"
                    ls -la "$dir"
                    rm -rf "$dir"/* "$dir"/.[!.]* 2>/dev/null || true
                    echo "--- ${dir} after"
                    ls -la "$dir"
                  done
                  echo "=== wipe complete ==="
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: masterless-data
                  mountPath: /masterless
                - name: vaultwarden-data
                  mountPath: /vaultwarden
          containers:
            - name: restart
              # Official kubectl image. It is distroless (no shell by design), so
              # kubectl itself is the entrypoint — keep the arguments flat.
              image: registry.k8s.io/kubectl:v1.31.4
              command:
                - kubectl
                - rollout
                - restart
                - deployment/masterless
                - deployment/masterless-vaultwarden
                - --namespace=vaultwarden-masterless-demo
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: masterless-data
              persistentVolumeClaim:
                claimName: masterless-data
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: masterless-vaultwarden-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaultwarden-masterless-demo-reset
  namespace: vaultwarden-masterless-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-masterless-demo-reset
  namespace: vaultwarden-masterless-demo
rules:
  # `kubectl rollout restart` patches the pod template
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-masterless-demo-reset
  namespace: vaultwarden-masterless-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vaultwarden-masterless-demo-reset
subjects:
  - kind: ServiceAccount
    name: vaultwarden-masterless-demo-reset
    namespace: vaultwarden-masterless-demo
