apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: vaultwarden-masterless
  namespace: vaultwarden-masterless-demo
spec:
  interval: 12h
  url: oci://harbor.lag0.com.br/library/vaultwarden-masterless
  ref:
    semver: ">=0.3.0 <0.4.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden-masterless-demo
  namespace: vaultwarden-masterless-demo
spec:
  releaseName: vaultwarden-masterless-demo
  targetNamespace: vaultwarden-masterless-demo
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: vaultwarden-masterless
    namespace: vaultwarden-masterless-demo
  values:
    fullnameOverride: masterless

    image:
      repository: harbor.lag0.com.br/library/vaultwarden-masterless
      tag: sha-cfc04bd6
    config:
      userKeysUrl: "https://vaultwarden-masterless-demo.lag0.com.br/user-keys"
      logLevel: "info"
      compatVwVersion: "1.37.3"
      compatLastTested: "2026-09-18"
      compatStatusUrl: "https://git.lag0.com.br/antoniolago/vaultwarden-masterless/blob/main/COMPATIBILITY.md"
      syntheticOrgName: "Vaultwarden Masterless Demo Organization"
      syntheticOrgIdentifier: "VW_MASTERLESS_DEMO"

    persistence:
      enabled: true
      storageClass: "large-storage"
      size: 1Gi

    # --- Bundled Vaultwarden ---
    vaultwarden:
      enabled: true
      image:
        repository: vaultwarden/server
        tag: 1.37.3
        pullPolicy: Always
      domain: "https://vaultwarden-masterless-demo.lag0.com.br"
      signupsAllowed: "false"
      ssoOnly: "true"
      # The daily reset empties Vaultwarden's database, so the demo account has to
      # be able to come back through SSO. Password signups stay disabled, and the
      # only identity that can authenticate here is the Keycloak demo user.
      extraEnv:
        SSO_SIGNUPS_ALLOWED: "true"
      adminToken:
        existingSecret: "vaultwarden-masterless-secrets"
        key: "ADMIN_TOKEN"
      sso:
        clientId: "vaultwarden"
        clientSecret:
          existingSecret: "vaultwarden-masterless-secrets"
          key: "VAULTWARDEN_CLIENT_SECRET"
        authority: "https://vaultwarden-masterless-demo-kc.lag0.com.br/realms/demo"
        pkce: "true"
      persistence:
        enabled: true
        storageClass: "large-storage"
        size: 1Gi

    # --- Bundled Keycloak ---
    keycloak:
      enabled: true
      hostname: "https://vaultwarden-masterless-demo-kc.lag0.com.br"
      # Cloudflare terminates TLS and hands the gateway plain HTTP, so a dynamic
      # backchannel would advertise an http:// token endpoint and send the
      # authorization-code exchange (client secret included) in cleartext.
      hostnameBackchannelDynamic: false
      adminPassword:
        existingSecret: "vaultwarden-masterless-demo-keycloak-secrets"
        key: "ADMIN_TOKEN"
      persistence:
        enabled: true
        storageClass: "large-storage"
        size: 1Gi
      setup:
        realm: "demo"
        clientId: "vaultwarden"
        clientSecret:
          existingSecret: "vaultwarden-masterless-secrets"
          key: "VAULTWARDEN_CLIENT_SECRET"
        redirectDomain: "https://vaultwarden-masterless-demo.lag0.com.br"
        demoUser:
          username: "demo"
          password:
            existingSecret: "vaultwarden-masterless-demo-keycloak-secrets"
            key: "DEMO_USER_PASSWORD"
          email: "demo@demo.masterless.example"
          firstName: "Demo"
          lastName: "User"
