apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mas-postgres
  namespace: matrix
  labels:
    app: mas-postgres
spec:
  serviceName: mas-postgres
  replicas: 1
  selector:
    matchLabels:
      app: mas-postgres
  template:
    metadata:
      labels:
        app: mas-postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: postgres
        image: postgres:16-alpine
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: mas
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mas-postgres
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: mas
        - name: POSTGRES_INITDB_ARGS
          value: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mas-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: mas-postgres
  namespace: matrix
spec:
  selector:
    app: mas-postgres
  ports:
  - name: pg
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mas-postgres-data
  namespace: matrix
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: large-storage
