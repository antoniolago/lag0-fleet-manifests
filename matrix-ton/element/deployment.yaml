apiVersion: apps/v1
kind: Deployment
metadata:
  name: element
  namespace: matrix
  labels:
    app: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element
  template:
    metadata:
      labels:
        app: element
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: element
        image: vectorim/element-web:v1.12.26
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DEFAULT_WELCOME_BACKGROUND_URLS
          value: "[]"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
