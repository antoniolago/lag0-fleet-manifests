apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: matrix
data:
  homeserver.yaml.tpl: |
    server_name: "matrix.lag0.com.br"

    # Listen on 0.0.0.0:8008, no TLS (Istio tunnel handles TLS)
    listeners:
      - port: 8008
        type: http
        bind_addresses: ["0.0.0.0"]
        x_forwarded: true
        resources:
          - names: [client, federation, media]

    # Public URL — needed so Synapse serves /.well-known/matrix/client
    # (which Element X relies on to discover the homeserver + SSO/OIDC flow).
    public_baseurl: "https://matrix.lag0.com.br/"
    serve_server_wellknown: true

    # SQLite (plenty for this private 2-bot + 1-user instance; avoids the
    # PostgreSQL C-collation requirements entirely)
    database:
      name: sqlite3
      args:
        database: /data/homeserver.db
    max_fetch_workers: 1

    log_config: /data/log.yaml
    media_store_path: /data/media_store

    # SECURITY: no open registration - access ONLY via PocketID OIDC
    enable_registration: false
    # Disable auto-join rooms on first user (caused 500 in registration)
    autocreate_auto_join_rooms: false
    registration_requires_token: false
    # SECURITY: login ONLY via SSO/OIDC (Pocket ID). Disable the local password
    # database so nobody can log in with a username/password.
    password_config:
      enabled: false
      localdb_enabled: false

    # OAuth delegation via MAS (MSC3861) — replaces classic SSO/OIDC.
    # (Synapse forbids SSO/OIDC providers when matrix_authentication_service is enabled.)
    enable_oidc: false

    # MAS (Matrix Authentication Service) — OIDC-native auth for Element X (MSC3861).
    # Delegates login to the MAS service, which delegations to Pocket ID as an upstream.
    # MAS (Matrix Authentication Service) — Element X OIDC nativo (MSC3861)
    # NOTE: secret must come from a FILE (secret_path); inline secrets are
    # DISABLED in Synapse 1.159+ (ConfigError → mas.enabled never set).
    matrix_authentication_service:
      enabled: true
      endpoint: http://mas.matrix.svc.cluster.local:8080/
      secret_path: /data/mas-secret

    # Federation off - private instance
    enable_email_notifs: false
    report_stats: false

    macaroon_secret_key: "$SYNAPSE_MACAROON"
    registration_shared_secret: "$SYNAPSE_REGISTRATION_SHARED_SECRET"
    signing_key_path: /data/matrix.signing.key
    federation_client_cert_path: null
    federation_server_cert_path: null
  log.yaml: |
    version: 1
    formatters:
      precise:
        format: '%(asctime)s - %(name)s - %(lineno)d - %(levelname)s - %(request)s - %(message)s'
    handlers:
      file:
        class: logging.handlers.RotatingFileHandler
        formatter: precise
        filename: /data/synapse.log
        maxBytes: 1048576
        backupCount: 3
      console:
        class: logging.StreamHandler
        formatter: precise
    loggers:
      synapse.storage.SQL:
        level: DEBUG
    root:
      level: DEBUG
      handlers: [file, console]
