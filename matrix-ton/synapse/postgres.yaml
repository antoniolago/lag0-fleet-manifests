apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse-postgres
  namespace: matrix
  labels:
    app: synapse-postgres
spec:
  serviceName: synapse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: synapse-postgres
  template:
    metadata:
      labels:
        app: synapse-postgres
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: synapse
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: synapse-secrets
              key: SYNAPSE_DB_PASSWORD
        - name: POSTGRES_DB
          value: synapse
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: synapse-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: synapse-postgres
  namespace: matrix
spec:
  selector:
    app: synapse-postgres
  ports:
  - name: pg
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-postgres-data
  namespace: matrix
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: large-storage
