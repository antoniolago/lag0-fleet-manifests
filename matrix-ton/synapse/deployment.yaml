apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
  labels:
    app: synapse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      enableServiceLinks: false
      initContainers:
      - name: render-config
        image: busybox:1.36
        command: ["sh", "-c"]
        env:
        - name: SYNAPSE_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: synapse-secrets, key: SYNAPSE_CLIENT_SECRET } }
        - name: SYNAPSE_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: synapse-secrets, key: SYNAPSE_DB_PASSWORD } }
        - name: SYNAPSE_MACAROON
          valueFrom: { secretKeyRef: { name: synapse-secrets, key: SYNAPSE_MACAROON } }
        - name: SYNAPSE_REGISTRATION_SHARED_SECRET
          valueFrom: { secretKeyRef: { name: synapse-secrets, key: SYNAPSE_REGISTRATION_SHARED_SECRET } }
        args:
          - |
            set -e
            # Fix NFS perms (Synapse runs as UID 991)
            chown -R 991:991 /data
            # Render homeserver.yaml from the template, injecting secrets from env.
            # Values are hex/alpha so plain sed substitution is safe.
            sed -e "s|\$SYNAPSE_CLIENT_SECRET|$SYNAPSE_CLIENT_SECRET|g" \
                -e "s|\$SYNAPSE_DB_PASSWORD|$SYNAPSE_DB_PASSWORD|g" \
                -e "s|\$SYNAPSE_MACAROON|$SYNAPSE_MACAROON|g" \
                -e "s|\$SYNAPSE_REGISTRATION_SHARED_SECRET|$SYNAPSE_REGISTRATION_SHARED_SECRET|g" \
                /config/homeserver.yaml.tpl > /data/homeserver.yaml
            cp /config/log.yaml /data/log.yaml
            chown 991:991 /data/homeserver.yaml /data/log.yaml
            echo "config rendered"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      containers:
      - name: synapse
        image: matrixdotorg/synapse:v1.159.0
        ports:
        - containerPort: 8008
          name: http
        volumeMounts:
        - name: data
          mountPath: /data
        readinessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 15
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /health
            port: 8008
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1Gi
      volumes:
      - name: config
        configMap:
          name: synapse-config
      - name: data
        persistentVolumeClaim:
          claimName: synapse-data
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app: synapse
  ports:
  - name: http
    port: 8008
    targetPort: 8008
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
  namespace: matrix
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: large-storage
