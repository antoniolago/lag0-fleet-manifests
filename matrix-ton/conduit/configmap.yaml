apiVersion: v1
kind: ConfigMap
metadata:
  name: conduit-config
  namespace: matrix
data:
  conduit.toml: |
    [global]
    server_name = "matrix.lag0.com.br"
    database_backend = "sqlite"
    database_path = "/var/lib/matrix-conduit/"
    port = 6167
    address = "0.0.0.0"
    max_request_size = 20000000
    allow_registration = false
    allow_federation = false
    allow_check_for_updates = false

    [global.well_known]
    client = "https://matrix.lag0.com.br"
    server = "matrix.lag0.com.br:443"
