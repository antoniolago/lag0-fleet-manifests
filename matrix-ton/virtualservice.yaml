apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: matrix
  namespace: matrix
spec:
  hosts:
    - matrix.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        # Legacy client /login, /register, /account handled by MAS (compat),
        # NOT Synapse (Synapse returns 404 for these when MAS is enabled).
        - uri:
            prefix: /_matrix/client/v3/login
        - uri:
            prefix: /_matrix/client/v3/register
        - uri:
            prefix: /_matrix/client/v3/account
      headers:
        request:
          set:
            X-Forwarded-Proto: https
      route:
        - destination:
            host: mas
            port:
              number: 8080
    - match:
        - uri:
            prefix: /_matrix/
        - uri:
            prefix: /_synapse/
      headers:
        request:
          set:
            # Cloudflare Tunnel delivers plain HTTP to the gateway, so Envoy
            # reports X-Forwarded-Proto: http. Synapse uses it to build the SSO
            # redirect_uri; http makes its callback mismatch the Pocket ID
            # https redirect_uri -> infinite redirect. Force https.
            X-Forwarded-Proto: https
      route:
        - destination:
            host: synapse
            port:
              number: 8008
    - match:
        - uri:
            prefix: /.well-known
      route:
        - destination:
            host: wellknown
            port:
              number: 80
    - route:
        - destination:
            host: element
            port:
              number: 80
