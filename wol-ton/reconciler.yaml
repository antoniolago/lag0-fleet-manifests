apiVersion: v1
kind: ConfigMap
metadata:
  name: upsnap-status-reconciler
  namespace: wol
data:
  reconcile.py: |
    import json
    import os
    import subprocess
    import urllib.request
    from datetime import datetime, timezone

    BASE = os.environ.get("UPSNAP_URL", "http://upsnap.wol.svc.cluster.local")
    STALE = int(os.environ.get("STALE_SECONDS", "90"))


    def request(path, data=None, method=None, token=None):
        body = None if data is None else json.dumps(data).encode()
        req = urllib.request.Request(BASE + path, data=body, method=method or ("POST" if body else "GET"))
        req.add_header("Content-Type", "application/json")
        if token:
            req.add_header("Authorization", token)
        with urllib.request.urlopen(req, timeout=15) as resp:
            raw = resp.read().decode()
            return json.loads(raw) if raw else None


    def login():
        return request("/api/collections/_superusers/auth-with-password", {
            "identity": os.environ["UPSNAP_ADMIN_EMAIL"],
            "password": os.environ["UPSNAP_ADMIN_PASSWORD"],
        })["token"]


    def alive(ip):
        try:
            return subprocess.run(["ping", "-c", "1", "-W", "2", ip],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL).returncode == 0
        except Exception:
            return False


    def main():
        token = login()
        items = request("/api/collections/devices/records?perPage=200", token=token)["items"]
        now = datetime.now(timezone.utc)
        for dev in items:
            if dev.get("status") != "pending":
                continue
            updated = datetime.fromisoformat(dev["updated"].replace("Z", "+00:00"))
            age = (now - updated).total_seconds()
            if age < STALE:
                continue
            want = "online" if alive(dev.get("ip", "")) else "offline"
            request("/api/collections/devices/records/" + dev["id"], {"status": want},
                    method="PATCH", token=token)
            print(f"{dev.get('name')}: pending {int(age)}s -> {want}", flush=True)


    main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upsnap-status-reconciler
  namespace: wol
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 55
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          annotations:
            descheduler.alpha.kubernetes.io/evict: "false"
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: docker.io/python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python
                - /app/reconcile.py
              env:
                - name: UPSNAP_URL
                  value: http://upsnap.wol.svc.cluster.local
                - name: STALE_SECONDS
                  value: "90"
                - name: UPSNAP_ADMIN_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: upsnap-admin
                      key: email
                - name: UPSNAP_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: upsnap-admin
                      key: password
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - NET_RAW
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: upsnap-status-reconciler
