---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: homarr
  namespace: homarr
spec:
  interval: 12h
  url: oci://ghcr.io/homarr-labs/charts/homarr
  ref:
    semver: "*"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
  namespace: homarr
spec:
  targetNamespace: homarr
  timeout: 5m
  install:
    createNamespace: false
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: homarr
  values:
    # Sem isto o container roda com filesystem efêmero: cada restart apaga
    # banco, usuários, boards e o setup ("Administrator sign-in required").
    persistence:
      homarrDatabase:
        enabled: true
        storageClassName: local-path
        size: 2Gi
    env:
      TZ: "America/Sao_Paulo"
      AUTH_PROVIDERS: "oidc"
      AUTH_OIDC_AUTO_LOGIN: "true"
      AUTH_OIDC_ISSUER: "https://id.lag0.com.br"
      AUTH_OIDC_CLIENT_NAME: "OIDC"
      AUTH_OIDC_GROUPS_ATTRIBUTE: "groups"
      AUTH_OIDC_SCOPE_OVERWRITE: "openid email profile groups"