  name: voice-external
  namespace: reverse-proxy
spec:
  hosts:
    - voice.lag0.com.br
  ports:
    - number: 3010
      name: http-web
      protocol: HTTP
    - number: 7880
      name: http-livekit
      protocol: HTTP
  resolution: STATIC
  endpoints:
    - address: 192.168.88.108
