---
# RomM — o "gaming server" das ROMs: indexa a biblioteca por plataforma, busca
# metadata/capas, serve web UI (com OIDC no Pocket ID) e roda tarefas de scan.
#
# Storage: library é RWX e compartilhada com o Syncthing (que recebe do Deck);
# resources/assets/redis são só dele.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romm
  namespace: romm
  labels:
    app: romm
spec:
  replicas: 1
  # PVCs NFS são single-writer: nunca dois pods ao mesmo tempo na mesma volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romm
  template:
    metadata:
      labels:
        app: romm
    spec:
      # ⚠️ OBRIGATÓRIO: o K8s injeta `<SVC>_PORT=tcp://<ip>:8080` como env var, e o
      # nginx que o RomM roda tenta dar bind nesse host literal → crashloop com
      # `invalid host in "tcp://<ip>:8080" of the "listen" directive`.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
      - name: wait-for-db
        image: docker.io/library/busybox:1.36
        command: ["sh", "-c", "until nc -z romm-mariadb 3306; do echo 'waiting for mariadb'; sleep 3; done; echo 'db reachable'"]
      - name: fix-permissions
        image: docker.io/library/busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /romm/resources /romm/assets /romm/library /redis-data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: resources
          mountPath: /romm/resources
        - name: assets
          mountPath: /romm/assets
        - name: library
          mountPath: /romm/library
        - name: redis
          mountPath: /redis-data
      containers:
      - name: romm
        image: docker.io/rommapp/romm:5.3.1
        ports:
        - name: http
          containerPort: 8080
        env:
        # ---- banco ----
        - name: ROMM_DB_DRIVER
          value: mariadb
        - name: DB_HOST
          value: romm-mariadb
        - name: DB_NAME
          value: romm
        - name: DB_USER
          value: romm-user
        - name: DB_PASSWD
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: MARIADB_PASSWORD
        # ---- app ----
        - name: ROMM_BASE_URL
          value: https://romm.lag0.com.br
        - name: ROMM_AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: ROMM_AUTH_SECRET_KEY
        # 1 worker por CPU disponível no nó; concurrency = 2xCPU+1.
        - name: SCAN_WORKERS
          value: "2"
        - name: WEB_SERVER_CONCURRENCY
          value: "3"
        # Casamento de hashes sem cadastro/API key (RetroAchievements precisa key própria).
        - name: HASHEOUS_API_ENABLED
          value: "true"
        # ---- varredura da biblioteca ----
        # O cron é o ÚNICO gatilho confiável nesta arquitetura: a biblioteca chega
        # escrita por outro pod via NFS, e inotify/watchfiles não enxerga alteração
        # remota, então ENABLE_RESCAN_ON_FILESYSTEM_CHANGE não serviria.
        - name: ENABLE_SCHEDULED_RESCAN
          value: "true"
        - name: SCHEDULED_RESCAN_CRON
          value: "*/2 * * * *"   # TEMPORÁRIO: força a varredura inicial da biblioteca
        - name: ENABLE_RESCAN_ON_FILESYSTEM_CHANGE
          value: "false"
        # ---- OIDC / Pocket ID (todos os logins por lá) ----
        - name: OIDC_ENABLED
          value: "true"
        - name: OIDC_PROVIDER
          value: pocket-id
        - name: OIDC_AUTOLOGIN
          value: "false"
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: romm-secrets
              key: OIDC_CLIENT_SECRET
        - name: OIDC_REDIRECT_URI
          value: https://romm.lag0.com.br/api/oauth/openid
        - name: OIDC_SERVER_APPLICATION_URL
          value: https://id.lag0.com.br
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        # Scans de biblioteca grande estouram memória com 2Gi (hash dos arquivos).
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
        volumeMounts:
        - name: library
          mountPath: /romm/library
        - name: resources
          mountPath: /romm/resources
        - name: assets
          mountPath: /romm/assets
        - name: redis
          mountPath: /redis-data
      volumes:
      - name: library
        persistentVolumeClaim:
          claimName: romm-library
      - name: resources
        persistentVolumeClaim:
          claimName: romm-resources
      - name: assets
        persistentVolumeClaim:
          claimName: romm-assets
      - name: redis
        persistentVolumeClaim:
          claimName: romm-redis
---
apiVersion: v1
kind: Service
metadata:
  name: romm
  namespace: romm
spec:
  selector:
    app: romm
  ports:
  - name: http
    port: 8080
    targetPort: http
