apiVersion: v1
kind: Service
metadata:
  name: project-nomad-vm
  namespace: project-nomad
  labels:
    app: project-nomad-vm
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: project-nomad-vm-1
  namespace: project-nomad
  labels:
    kubernetes.io/service-name: project-nomad-vm
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.88.246
    conditions:
      ready: true
