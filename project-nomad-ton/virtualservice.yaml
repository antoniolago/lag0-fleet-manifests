apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: project-nomad
  namespace: project-nomad
spec:
  hosts:
    - nomad.lag0.com.br
  gateways:
    - istio-system/lag0-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: oauth2-proxy
            port:
              number: 4180
