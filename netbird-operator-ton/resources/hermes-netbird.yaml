apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: hermes
  namespace: hermes
spec:
  name: hermes
  allowExtraDnsLabels: true
  ephemeral: false
  autoGroups:
  # Grupo de destino dos peers matriculados por esta key. Referenciado pelo ID na
  # management porque: `localRef` exige um CR Group (que colidia com o grupo ja
  # existente: `group with name hermes-hub already exists` em loop) e `name` tambem
  # e' resolvido como CR local (`Group.netbird.io "hermes-hub" not found`).
  - id: dasnube2kacs73cmltg0
