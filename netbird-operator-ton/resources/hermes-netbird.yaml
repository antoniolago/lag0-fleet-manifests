apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: hermes
  namespace: hermes
spec:
  name: hermes
  allowExtraDnsLabels: true
  ephemeral: false
  autoGroups:
  # Referencia o grupo pelo NOME no Netbird, nao por um objeto Group local.
  # O CR Group tentava CRIAR o grupo "hermes-hub", mas ele ja existe na management
  # (criado junto com o peer do hub) e o operator v0.6.0 nao adota grupo existente:
  # resultado era `group with name hermes-hub already exists` em loop no reconcile.
  - name: hermes-hub
