apiVersion: netbird.io/v1alpha1
kind: SetupKey
metadata:
  name: hermes
  namespace: hermes
spec:
  name: hermes
  allowExtraDnsLabels: true
  ephemeral: false
  autoGroups:
  # Peers enrolled with this key join the `hermes-hub` group, which is what scopes the
  # hub's mesh reachability. The reference must be a `Group` (groups.netbird.io) —
  # the SetupKey controller resolves localRef against that kind, and pointing it at an
  # NBGroup object makes the reconcile fail with
  # `Group.netbird.io "hermes-hub" not found`.
  - localRef:
      name: hermes-hub
---
apiVersion: netbird.io/v1alpha1
kind: Group
metadata:
  name: hermes-hub
  namespace: hermes
spec:
  name: hermes-hub
